<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<title>Ujwal Shyam Kantimohanthy</title>
<meta name="description" content="Ujwal Shyam Kantimohanthy — ICT / network infrastructure engineering student building reliable web systems, evidence-grounded AI tools and network experiments.">
<style>
  :root{--bg:#0A0B0D;--panel:#101317;--line:#20252B;--text:#F5F5F5;--muted:#8A9098;--blue:#4F8CFF}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--text);font:16px/1.6 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:24px}
  main{max-width:620px}
  .eyebrow{font:12px ui-monospace,Menlo,Consolas,monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
  h1{font-size:clamp(28px,5vw,40px);letter-spacing:-.02em;margin:6px 0 10px;line-height:1.15}
  p{color:var(--muted);margin:0 0 22px}
  nav{display:flex;flex-wrap:wrap;gap:10px}
  a{color:var(--text);text-decoration:none;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:9px 14px;font-size:14px}
  a:hover{border-color:var(--blue)}
  a.quiet{color:var(--muted)}
</style>
</head>
<body>
<main>
  <div class="eyebrow">ICT · Networks · Infrastructure</div>
  <h1>Ujwal Shyam Kantimohanthy</h1>
  <p>Engineering student at the University of Rome Tor Vergata, building reliable web systems, evidence-grounded AI tools and network experiments.</p>
  <nav>
    <a href="https://kantimohanthy.dev" rel="noopener">Portfolio</a>
    <a href="https://www.linkedin.com/in/ujwalshyam-kantimohanthy/" rel="noopener noreferrer">LinkedIn</a>
    <a href="https://github.com/kantimohanthy" rel="noopener noreferrer">GitHub</a>
    <a class="quiet" href="/masters/">Private tracker</a>
  </nav>
</main>
</body>
</html>
